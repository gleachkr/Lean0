[package]
name = "lean0-check"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Lean0's trusted side: the statement checker, the text the verifiers check against, and the spec"

# Trusted code: it must not depend on the generator (the lean0 crate, mm0kit), only on
# nanoda's export parser.
[dependencies]
nanoda_lib = { path = "../build/nanoda" }  # scripts/nanoda.sh apply
num-bigint = "0.5.1"
serde_json = "1.0.111"
