[workspace]
resolver = "2"
# nanoda_lib is upstream at a pinned commit plus patches/nanoda_lib.patch, made in build/nanoda
# by scripts/nanoda.sh (and by flake.nix); it is a dependency, not a member.
members = ["lean0", "lean0-check", "mm0kit"]
exclude = ["build"]

[profile.release]
opt-level = 3
overflow-checks = true
debug = 1

[profile.dev]
opt-level = 1
